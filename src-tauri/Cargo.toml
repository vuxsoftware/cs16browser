[package]
name = "cs16browser"
version = "0.1.0"
description = "External Counter-Strike 1.6 server browser with fake-server detection"
authors = ["vuxsoftware"]
license = "GPL-3.0-or-later"
repository = "https://github.com/vuxsoftware/cs16browser"
edition = "2021"

# The `_lib` suffix keeps the lib name unique against the bin name on Windows.
[lib]
name = "cs16browser_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
parking_lot = "0.12"
ureq = { version = "3", default-features = false, features = ["rustls", "gzip", "json"] }
tokio = { version = "1", features = ["full"] }
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta-typescript = "0.0.12"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
